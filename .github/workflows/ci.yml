# Continuous Integration: on every push, GitHub builds the project on Linux
# and runs all tests twice, once with g++ and once with clang++ plus
# AddressSanitizer and UndefinedBehaviorSanitizer, so broken code or memory
# bugs are caught before they reach main.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: make test (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler version
        run: g++ --version
      - name: Build and run all tests
        run: make test
        
  sanitizers:
    name: make test (clang++ with ASan and UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and the sanitizer runtime
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Build and run all tests with sanitizers
        run: >
          make test CXX=clang++-18
          CXXFLAGS="-std=c++20 -Wall -Wextra -pedantic -g -Iinclude
          -fsanitize=address,undefined -fno-sanitize-recover=all
          -fno-omit-frame-pointer"